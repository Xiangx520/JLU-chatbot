[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlu-chatbot-main"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dashscope>=1.27.7",
    "langchain>=1.4.2",
    # Ragas 0.4.3 imports legacy VertexAI modules removed in community 0.4.2.
    "langchain-community>=0.4.1,<0.4.2",
    "langchain-deepseek>=1.1.1",
    "langchain-milvus>=0.4.0",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=2.0.0",
    "pymilvus>=3.0.2",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "ragas==0.4.3",
    "streamlit>=1.64.0",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.setuptools.packages.find]
where = ["src"]
include = ["JLU_agent*"]
exclude = ["JLU_agent.evaluation*"]
namespaces = false
